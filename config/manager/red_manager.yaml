team_color: "red"
# ★ 关键修正：改为 3V3 仿真中的三台红车命名空间
my_cars: ["robot_red1", "robot_red2", "robot_red3"]
# ★ 关键修正：决策频率从 0.2Hz（每5秒一次）改为 20Hz（每秒20次），让小车反应更快
loop_hz: 20.0
# ★ 关键修正：降低状态超时，避免等待过久
state_timeout_s: 2.0
# ★ 关键修正：暂时关闭 LLM，避免连接出错影响启动
llm_enabled: false
# 清空巡逻点，因为 Manager 会通过博弈决策分配任务
default_patrol_points: []
# 场地边界：所有下发目标点都会被夹进这个矩形（对应 worlds/world0.world 的围墙）
arena_min_x: -3.9
arena_max_x: 3.9
arena_min_y: -1.9
arena_max_y: 1.9
# 侦察点轮换周期（秒）：到点后隔这么久换下一个侦察目标，避免车“到了就站着不动”
scout_dwell_s: 8.0
# 如果未来想启用 LLM，再按需配置
llm:
   enabled: false
   service_url: "http://127.0.0.1:8001/plan"
   timeout_s: 30
